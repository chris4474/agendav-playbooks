- name: Creation du Stack Agendav
  hosts: localhost
  connection: local
#  gather_facts: false
  vars_files:
    - secrets.yaml
    - vars/advanced.yaml
    - vars/overrides.yaml

  tasks:

    - name: Build Baikal Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/baikal_stack.yaml 

    - name: Build Agendav Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/agendav_stack.yaml 

    - name: Build mariadb Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/mariadb_stack.yaml 

#
# we don't need db-init as the user is supposed to deploy/start/stop the components individually
#
#    - name: Build db-init Docker Compose files
#      ansible.builtin.import_tasks:
#        file: tasks/db-init_stack.yaml

    - name: Build utilities
      ansible.builtin.import_tasks:
        file: tasks/buildscripts.yaml

