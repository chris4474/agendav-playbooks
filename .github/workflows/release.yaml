name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version file
        run: echo "${{ github.ref_name }}" > version_do_not_delete.txt

      - name: Create Release Archive
        run: |
          tar -czf "$RUNNER_TEMP/${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz" \
            --exclude="${{ github.event.repository.name }}/.git" \
            --exclude="${{ github.event.repository.name }}/.github" \
            -C .. \
            "${{ github.event.repository.name }}"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: true
