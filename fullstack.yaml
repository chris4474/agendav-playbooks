- name: Creation du Stack Agendav
  hosts: localhost
  connection: local
#  gather_facts: false
  vars_files:
    - secrets.yaml
    - vars/advanced.yaml
    - vars/overrides.yaml

  tasks:
    - name: Full Stack or Standalone compose files
      ansible.builtin.set_fact:
        generate_full_stack: true

    - name: Build Baikal Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/baikal_stack.yaml 

    - name: Build Agendav Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/agendav_stack.yaml 

    - name: Build mariadb Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/mariadb_stack.yaml 

    - name: Build db-init Docker Compose files
      ansible.builtin.import_tasks:
        file: tasks/db-init_stack.yaml

    - name: Full Stack assembly
      ansible.builtin.include_tasks:
        file: tasks/fullstack_assembly.yaml
      when: standalone is undefined

