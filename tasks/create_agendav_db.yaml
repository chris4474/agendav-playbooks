
    - name: Créer la base de données {{ agendav_db_database }}
      ansible.mariadb.mariadb_db:
        login_host: 127.0.0.1
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        name: "{{ agendav_db_database }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: Créer l'utilisateur associé et lui donner les droits
      ansible.mariadb.mariadb_user:
        login_host: 127.0.0.1
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        name: "{{ agendav_db_user }}"
        password: "{{ agendav_db_password }}"
        priv: "{{ agendav_db_database }}.*:ALL"
        host: "%"
        state: present

